[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations", "__pypackages__", "venv"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
addopts = "--ignore=__pypackages__"

[tool.django-stubs]
django_settings_module = "config.settings.local"
ignore_missing_settings = true

[tool.isort]
known_local_folder = ["apps", "config"]
profile = "black"

[tool.ruff]
exclude = [
    "config/settings"
]

[project]
name = "finance.danielmoessner.de"
version = "0.0.0"
description = ""
authors = [
    {name = "danielmoessner", email = "github@danielmoessner.de"},
]
dependencies = [
    "beautifulsoup4==4.15.*",
    "django==6.1.*",
    "django-debug-toolbar==8.0.*",
    "Jinja2==3.1.*",
    "pandas==3.1.*",
    "pytz==2026.*",
    "requests==2.34.*",
    "pydantic==2.14.*",
    "selenium==4.54.*",
    "webdriver-manager==4.1.*",
    "pytest==9.2.*",
    "numpy==2.5.*",
    "gunicorn==27.*",
]
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}

[tool.setuptools]
packages = []

[dependency-groups]
dev = [
    "django-types==0.24.*",
    "types-requests==2.33.*",
    "mypy==2.4.*",
    "black==26.*",
    "djlint==1.54.*",
    "isort==9.*",
    "ruff==0.*",
    "pytest-django==4.*",
]