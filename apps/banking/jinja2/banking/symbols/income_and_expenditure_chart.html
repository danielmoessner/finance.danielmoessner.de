<h2>Income & Expenditure</h2>
<div class="w-100 rounded bg-dark mb-5"
     id="incomeAndExpenditureChart"
     style="height: 680px"></div>
<script src="{{ static('js/charts.js') }}"></script>
<script>
    am5.ready(function () {
        createIncomeAndExpenditureChart().catch(function (error) {
            console.error("Unable to initialize the income and expenditure chart", error);
        });
    });

    async function createIncomeAndExpenditureChart() {
        const root = am5.Root.new("incomeAndExpenditureChart");
        root.setThemes([
            am5themes_Animated.new(root),
            am5themes_Dark.new(root)
        ]);
        root.container.set("layout", root.verticalLayout);

        const chart = root.container.children.push(am5xy.XYChart.new(root, {
            width: am5.percent(100),
            height: am5.percent(82),
            panX: true,
            wheelX: "panX",
            wheelY: "zoomX"
        }));
        const response = await fetch("{{ url('banking:api_depot_income_and_expenditure_data', args=[object.pk]) }}");
        if (!response.ok) {
            throw new Error(`Chart data request failed: ${response.status}`);
        }
        const data = (await response.json()).map(function (item) {
            const [year, month] = item.date.split("-").map(Number);
            return {
                ...item,
                date: Date.UTC(year, month - 1, 1)
            };
        });

        const xAxis = chart.xAxes.push(am5xy.DateAxis.new(root, {
            baseInterval: { timeUnit: "month", count: 1 },
            dateFormats: { month: "MMM yyyy" },
            periodChangeDateFormats: { month: "MMM yyyy" },
            renderer: am5xy.AxisRendererX.new(root, {})
        }));
        const yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, {
            renderer: am5xy.AxisRendererY.new(root, {})
        }));

        function createSeries(name) {
            const series = chart.series.push(am5xy.ColumnSeries.new(root, {
                name: name,
                xAxis: xAxis,
                yAxis: yAxis,
                valueYField: name,
                valueXField: "date",
                stacked: true
            }));
            series.columns.template.setAll({
                tooltipText: "{name}\n{valueY}",
                tooltip: am5.Tooltip.new(root, {
                    labelText: "{name}\n{valueY}"
                })
            });
            series.data.setAll(data);
        }
        {% for category in categories %}
            createSeries("{{ category.name }}");
        {% endfor %}

        const legend = root.container.children.push(am5.Legend.new(root, {
            width: am5.percent(100),
            // height: am5.percent(10),
            centerX: am5.percent(40),
            x: am5.percent(50)
        }));
        legend.data.setAll(chart.series.values);
        chart.set("scrollbarX", am5.Scrollbar.new(root, {
            orientation: "horizontal"
        }));
    }
</script>
