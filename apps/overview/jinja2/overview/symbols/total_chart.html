<h2>Balance</h2>
<div class="w-100 rounded bg-dark mb-5"
     id="totalChart"
     style="height: 680px"></div>
<script src="{{ static('js/charts.js') }}"></script>
<script>
    am5.ready(function () {
        createTotalChart().catch(function (error) {
            console.error("Unable to initialize the balance chart", error);
        });
    });

    async function createTotalChart() {
        const root = am5.Root.new("totalChart");
        root.setThemes([
            am5themes_Animated.new(root),
            am5themes_Dark.new(root)
        ]);
        root.container.set("layout", root.verticalLayout);

        const chart = root.container.children.push(am5xy.XYChart.new(root, {
            // width: am5.percent(100),
            // height: am5.percent(82),
            panX: true,
            wheelX: "panX",
            wheelY: "zoomX"
        }));
        const response = await fetch("{{ url('overview:api_data') }}");
        if (!response.ok) {
            throw new Error(`Chart data request failed: ${response.status}`);
        }
        const data = await response.json();

        const xAxis = chart.xAxes.push(am5xy.DateAxis.new(root, {
            baseInterval: { timeUnit: "day", count: 1 },
            renderer: am5xy.AxisRendererX.new(root, {})
        }));
        const yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, {
            renderer: am5xy.AxisRendererY.new(root, {})
        }));

        function createSeries(name) {
            const series = chart.series.push(am5xy.LineSeries.new(root, {
                name: name,
                xAxis: xAxis,
                yAxis: yAxis,
                valueYField: name,
                valueXField: "date",
                tooltip: am5.Tooltip.new(root, {
                    labelText: "{name}: {valueY}"
                })
            }));
            series.strokes.template.set("strokeWidth", 3);
            series.data.setAll(data);
            return series;
        }
        {% for depot in active_depots %}
            createSeries("{{ depot.name }}");
        {% endfor %}

        const legend = root.container.children.push(am5.Legend.new(root, {
            // width: am5.percent(100),
            // height: am5.percent(18),
            // centerX: am5.percent(50),
            x: am5.percent(10),
            useDefaultMarker: true,
            fillField: "stroke",
            strokeField: "stroke"
        }));
        legend.data.setAll(chart.series.values);
        legend.itemContainers.template.events.on("pointerover", function (event) {
            const hoveredSeries = event.target.dataItem.dataContext;
            chart.series.each(function (series) {
                series.set("opacity", series === hoveredSeries ? 1 : 0.2);
            });
            hoveredSeries.toFront();
        });
        legend.itemContainers.template.events.on("pointerout", function () {
            chart.series.each(function (series) {
                series.set("opacity", 1);
            });
        });

        chart.set("scrollbarX", am5.Scrollbar.new(root, {
            orientation: "horizontal"
        }));
    }
</script>
